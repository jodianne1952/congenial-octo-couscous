<div id="app"><main style="max-width:700px;margin:12vh auto;padding:24px;font-family:system-ui"><h1>Ohio Docket Hub</h1><p>Loading the static prototype…</p></main></div>
<script>
(function(){
"use strict";
var cases=[
{id:"DEMO-2026-CV-0142",name:"Sample v. Sample",county:"Franklin",court:"Court of Common Pleas",status:"Open",filed:"Oct 2, 2026",category:"Civil",events:[{date:"Oct 2, 2026",title:"Complaint filed",note:"Fictional sample docket entry."},{date:"Oct 16, 2026",title:"Case management conference scheduled",note:"Fictional sample docket entry."}]},
{id:"DEMO-2026-CR-0087",name:"State v. Example",county:"Scioto",court:"Court of Common Pleas",status:"Open",filed:"Sep 18, 2026",category:"Criminal",events:[{date:"Sep 18, 2026",title:"Initial appearance",note:"Fictional sample docket entry."},{date:"Oct 7, 2026",title:"Pretrial hearing scheduled",note:"Fictional sample docket entry."}]},
{id:"DEMO-2025-CV-0319",name:"Example Properties v. Sample",county:"Scioto",court:"Municipal Court",status:"Closed",filed:"Nov 12, 2025",category:"Civil",events:[{date:"Nov 12, 2025",title:"Case filed",note:"Fictional sample docket entry."},{date:"Jan 9, 2026",title:"Judgment entered",note:"Fictional sample docket entry."}]}
];
var courtLink="https://sciotoclerk.com/online-records/";
var pages=["Search","Official court links","Saved cases","Settings"];
var state={page:"Search",query:"",county:"All counties",category:"All case types",selected:null,menu:false,saved:readSaved()};
function readSaved(){try{var v=JSON.parse(localStorage.getItem("ohio-docket-hub:saved-cases")||"[]");return Array.isArray(v)?v.filter(function(x){return typeof x==="string"}):[]}catch(e){return[]}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ico(name){var p={landmark:'<path d="M3 10h18M5 10v9m4-9v9m6-9v9m4-9v9M3 21h18M12 3 2 8h20L12 3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',bookmark:'<path d="M6 4h12v17l-6-4-6 4z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.8 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.8-1l-1.7.6-1.4-2.4 1.4-1.1a8 8 0 0 1 0-2L5.7 12l1.4-2.4 1.7.6a8 8 0 0 1 1.8-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.8 1l1.7-.6 1.4 2.4-1.4 1.1a8 8 0 0 1-.1 1.9z"/>',shield:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><path d="m9 12 2 2 4-4"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8m-8 4h8"/>',map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15m6-12v15"/>',arrow:'<path d="M7 17 17 7M7 7h10v10"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',close:'<path d="m18 6-12 12M6 6l12 12"/>'};return '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(p[name]||"")+'</svg>'}
function filtered(){var q=state.query.trim().toLowerCase();return cases.filter(function(c){return(!q||(c.id+" "+c.name+" "+c.county+" "+c.court).toLowerCase().indexOf(q)>=0)&&(state.county==="All counties"||c.county===state.county)&&(state.category==="All case types"||c.category===state.category)&&(state.page!=="Saved cases"||state.saved.indexOf(c.id)>=0)})}
function nav(){return '<aside class="sidebar '+(state.menu?"open":"")+'"><div class="brand"><span class="brand-mark">'+ico("landmark")+'</span><span class="brand-name">Ohio Docket Hub</span><button class="closemenu" data-action="close-menu" aria-label="Close navigation">'+ico("close")+'</button></div><div class="workspace">YOUR WORKSPACE</div><nav class="side-nav" aria-label="Main navigation">'+pages.map(function(p){var ic=p==="Search"?"search":p==="Official court links"?"landmark":p==="Saved cases"?"bookmark":"settings";return '<button class="nav-item '+(state.page===p&&!state.selected?"active":"")+'" data-page="'+esc(p)+'">'+ico(ic)+'<span>'+esc(p)+'</span>'+(p==="Saved cases"&&state.saved.length?'<span class="count">'+state.saved.length+'</span>':"")+'</button>'}).join("")+'</nav><div class="sidebar-bottom"><div>'+ico("shield")+' Your saved list stays on this device.</div><div class="version">Static prototype preview · Demo records</div></div></aside>'}
function card(c){var saved=state.saved.indexOf(c.id)>=0;return '<article class="card"><div class="cardtop"><span class="type">'+ico("file")+' '+esc(c.category)+'</span><button class="save '+(saved?"on":"")+'" data-save="'+esc(c.id)+'" aria-label="'+(saved?"Remove saved case":"Save case")+'" title="'+(saved?"Remove saved case":"Save case")+'">'+(saved?"★":"☆")+'</button></div><button class="casetitle" data-open="'+esc(c.id)+'">'+esc(c.name)+' '+ico("arrow")+'</button><div class="caseid">'+esc(c.id)+'</div><div class="meta"><span>'+ico("map")+' '+esc(c.county)+' County</span><span>'+ico("landmark")+' '+esc(c.court)+'</span></div><div class="cardbottom"><span class="status '+(c.status==="Closed"?"closed":"")+'"><span></span>'+esc(c.status)+'</span><button class="linkbtn" data-open="'+esc(c.id)+'">View timeline '+ico("arrow")+'</button></div></article>'}
function empty(title,text,action){return '<div class="empty"><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>'+(action||"")+'</div>'}
function heading(kicker,title,text){return '<div class="heading"><div><div class="eyebrow">'+esc(kicker)+'</div><h1>'+esc(title)+'</h1><p>'+esc(text)+'</p></div></div>'}
function searchPage(){var rs=filtered();return heading("OHIO COURT RECORDS","Find a court case","Search the demo records or open a county’s official docket portal.")+'<section class="panel" aria-label="Search demo cases"><label class="label" for="case-search">Search by name or case number</label><div class="searchrow"><label class="searchbox">'+ico("search")+'<input id="case-search" value="'+esc(state.query)+'" placeholder="For example, DEMO-2026-CV-0142" autocomplete="off"></label><label class="selectbox">'+ico("map")+'<select id="county"><option>All counties</option><option '+(state.county==="Franklin"?"selected":"")+'>Franklin</option><option '+(state.county==="Scioto"?"selected":"")+'>Scioto</option></select></label><label class="selectbox">'+ico("file")+'<select id="category"><option>All case types</option><option '+(state.category==="Civil"?"selected":"")+'>Civil</option><option '+(state.category==="Criminal"?"selected":"")+'>Criminal</option></select></label></div><div class="searchfoot"><span>'+ico("shield")+' Fictional sample records only</span><span>'+rs.length+' sample'+(rs.length===1?"":"s")+'</span></div></section><section class="section"><div class="sectionhead"><div><h2>Sample cases</h2><p>Examples demonstrate how results will appear.</p></div><span class="tag">FICTIONAL DATA</span></div>'+(rs.length?'<div class="grid">'+rs.map(card).join("")+'</div>':empty("No sample cases found","Try another name, number, county, or case type."))+'</section><section class="cta"><div class="ctaicon">'+ico("landmark")+'</div><div class="cta-copy"><h3>Looking for a real docket?</h3><p>Open an official court portal and verify records with the clerk.</p></div><button class="secondary" data-page="Official court links">View court links '+ico("arrow")+'</button></section>'}
function sourcePage(){return '<section class="subpage">'+heading("SOURCE DIRECTORY","Official court links","Open court-provided records portals and verify case information with the clerk.")+'<div class="summary">'+ico("shield")+' Links lead to external court websites. Availability and update timing vary. This hub does not import or monitor records.</div><article class="source"><div class="sourceicon">'+ico("landmark")+'</div><div class="sourcmain"><div class="sourcekicker">SCIOTO COUNTY · COMMON PLEAS</div><h2>Scioto County Clerk of Courts</h2><p>Official online records portal. Filings may be delayed; verify time-sensitive entries with the clerk.</p><p>Clerk’s office: <a href="tel:+17403558218">(740) 355-8218</a></p><div class="sourcelinks"><a class="primary" href="'+courtLink+'" target="_blank" rel="noopener noreferrer">Open records portal '+ico("arrow")+'</a><a class="linkbtn" href="https://sciotoclerk.com/" target="_blank" rel="noopener noreferrer">Court website '+ico("arrow")+'</a></div></div></article><article class="source"><div class="sourceicon">'+ico("landmark")+'</div><div class="sourcmain"><div class="sourcekicker">STATEWIDE RESOURCE</div><h2>Supreme Court of Ohio</h2><p>Find statewide online services and court resources. Availability depends on the court and case type.</p><div class="sourcelinks"><a class="primary" href="https://www.supremecourt.ohio.gov/online-services/" target="_blank" rel="noopener noreferrer">Browse online services '+ico("arrow")+'</a></div></div></article><div class="note"><strong>Before relying on a docket:</strong> Restricted, sealed, juvenile, and expunged matters may not be available online. A missing search result does not prove a case does not exist. Confirm deadlines and filings with the clerk.</div></section>'}
function detailPage(c){return '<section class="subpage"><button class="back" data-action="back">← Back to results</button><div class="detailhead"><div><div class="eyebrow">FICTIONAL DEMO CASE</div><h1>'+esc(c.name)+'</h1><p>'+esc(c.id)+'</p></div><button class="secondary" data-save="'+esc(c.id)+'">'+(state.saved.indexOf(c.id)>=0?"★ Saved":"☆ Save case")+'</button></div><div class="facts"><div><span>COURT</span><strong>'+esc(c.county)+' County '+esc(c.court)+'</strong></div><div><span>CASE TYPE</span><strong>'+esc(c.category)+'</strong></div><div><span>STATUS</span><strong>'+esc(c.status)+'</strong></div><div><span>FILED</span><strong>'+esc(c.filed)+'</strong></div></div><div class="timelinehead"><div><h2>Docket timeline</h2><p>Example events only — not official court entries.</p></div><span class="tag">SAMPLE</span></div><div class="timeline">'+c.events.map(function(e,i){return '<div class="event"><div class="marker">'+ico(i===0?"file":"clock")+'</div><div class="entry"><span>'+esc(e.date)+'</span><h3>'+esc(e.title)+'</h3><p>'+esc(e.note)+'</p></div></div>'}).join("")+'</div><div class="note"><strong>Important:</strong> The events above are invented examples. This prototype does not have access to the case record.</div></section>'}
function settingsPage(){return '<section class="subpage">'+heading("PREFERENCES","Settings","Manage this prototype’s local preferences.")+'<div class="settings"><div class="settingrow"><div><h3>Saved demo cases</h3><p>'+state.saved.length+' sample case'+(state.saved.length===1?"":"s")+' saved in this browser only.</p></div></div><div class="settingrow"><div><h3>Privacy</h3><p>Saved case IDs stay in this browser’s local storage. This prototype has no accounts or server-side storage.</p></div></div></div></section>'}
function render(){var title=state.selected?"Case details":state.page;var content=state.selected?detailPage(state.selected):state.page==="Search"?searchPage():state.page==="Official court links"?sourcePage():state.page==="Saved cases"?(function(){var rs=filtered();return '<section class="subpage">'+heading("ON THIS DEVICE","Saved cases","Keep demo case examples together for quick access.")+(rs.length?'<div class="grid">'+rs.map(card).join("")+'</div>':empty("No saved cases yet","Save a sample case from Search to see it here.","<button class='primary' data-page='Search'>Browse sample cases</button>"))+'</section>':'<section>'+settingsPage()+'</section>';document.getElementById("app").innerHTML='<div class="shell">'+nav()+'<button class="scrim" data-action="close-menu" aria-label="Close navigation"></button><main class="main"><header class="topbar"><button class="mobilemenu" data-action="open-menu" aria-label="Open navigation">'+ico("menu")+'</button><div class="breadcrumb"><span>Ohio Docket Hub</span><span>/</span><strong>'+esc(title)+'</strong></div><span class="pill"><span class="dot"></span> DEMO MODE</span></header><div class="content"><div class="banner"><span class="info">i</span><p><strong>Prototype using fictional sample records.</strong> This app does not search live Ohio court dockets. Use official court websites to verify real case information.</p></div>'+content+'<footer class="footer"><span>Ohio Docket Hub · Static prototype</span><span>Always verify records with the court clerk.</span></footer></div></main></div>'}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.page){state.page=b.dataset.page;state.selected=null;state.menu=false;render()}else if(b.dataset.open){state.selected=cases.find(function(c){return c.id===b.dataset.open})||null;render()}else if(b.dataset.save){var id=b.dataset.save;state.saved=state.saved.indexOf(id)>=0?state.saved.filter(function(x){return x!==id}):state.saved.concat([id]);try{localStorage.setItem("ohio-docket-hub:saved-cases",JSON.stringify(state.saved))}catch(e){}render()}else if(b.dataset.action==="back"){state.selected=null;render()}else if(b.dataset.action==="open-menu"){state.menu=true;render()}else if(b.dataset.action==="close-menu"){state.menu=false;render()}});
document.addEventListener("input",function(e){if(e.target.id==="case-search"){var start=e.target.selectionStart;state.query=e.target.value;render();var el=document.getElementById("case-search");el.focus();el.setSelectionRange(start,start)}});
document.addEventListener("change",function(e){if(e.target.id==="county"){state.county=e.target.value;render()}if(e.target.id==="category"){state.category=e.target.value;render()}});
render();
})();
</script>
</body>
</html>
